<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <!-- Tab Toggle Header -->
    <div class="tab-header">
      <button id="loginTabBtn" class="tab-btn active">Sign In</button>
      <button id="registerTabBtn" class="tab-btn">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active">
      <h2>Welcome Back</h2>
      <p class="subtitle">Enter your credentials to access your account</p>

      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="name@example.com" required>
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form">
      <h2>Create Account</h2>
      <p class="subtitle">Join us today in just a few steps</p>

      <div class="input-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required>
      </div>

      <div class="input-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="name@example.com" required>
      </div>

      <div class="input-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Minimum 8 characters" minlength="8" required>
      </div>

      <button type="submit" class="submit-btn">Create Account</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
